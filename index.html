<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Windows Minh-Nexus - minh234</title>
    <style>
        body { margin: 0; background: linear-gradient(135deg, #ffcc00, #ff66cc); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        #boot { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; font-size: 25px; flex-direction: column; }
        #desktop { height: calc(100vh - 50px); padding: 20px; display: none; position: relative; }
        
        /* Icon Desktop chuẩn Win 11 */
        .item { width: 90px; text-align: center; color: white; font-weight: 500; cursor: pointer; text-shadow: 1px 1px 3px black; font-size: 12px; }
        .item img { width: 48px; height: 48px; display: block; margin: 0 auto 5px; }

        /* Cửa sổ Windows 11 bo góc */
        .window { position: absolute; top: 80px; left: 80px; width: 450px; height: 300px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-radius: 12px; display: none; flex-direction: column; color: black; box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 100; border: 1px solid #ccc; transition: 0.2s; }
        .bar { padding: 10px 15px; display: flex; justify-content: space-between; cursor: move; }
        .btns span { cursor: pointer; padding: 0 10px; font-weight: bold; font-size: 16px; }

        /* Taskbar Windows 11 căn giữa + Tìm kiếm gõ được */
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 50px; background: rgba(255,255,255,0.2); backdrop-filter: blur(20px); display: none; align-items: center; padding: 0 15px; box-sizing: border-box; }
        .search-area { background: rgba(255,255,255,0.8); border-radius: 20px; padding: 5px 15px; width: 180px; display: flex; align-items: center; margin-right: 20px; border: 1px solid #ccc; }
        .search-area input { border: none; outline: none; background: transparent; width: 100%; font-size: 14px; }
        .task-center { flex: 1; display: flex; justify-content: center; gap: 12px; }
        .t-icon { width: 32px; height: 32px; cursor: pointer; transition: 0.2s; }
        .t-icon:hover { transform: scale(1.1); }

        /* Start Menu có minh234 */
        #start { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; z-index: 1000; flex-direction: column; align-items: center; padding-top: 50px; color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center; margin-bottom: 40px; }
        .app { border: 1px solid rgba(255,255,255,0.2); padding: 15px; width: 110px; background: rgba(255,255,255,0.1); cursor: pointer; border-radius: 8px; }
        .user-footer { border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; width: 350px; display: flex; justify-content: space-between; align-items: center; }

        #sh-screen { position: fixed; inset: 0; background: black; display: none; z-index: 10000; justify-content: center; align-items: center; font-size: 30px; color: white; }
    </style>
</head>
<body>

<div id="boot">🪟 Starting Windows Minh Nexus...</div>

<div id="desktop">
    <div class="item" onclick="openW('Recycle Bin', 'no times')">
        <img src="https://icons8.com" alt="Recycle Bin">
        Recycle Bin
    </div>

    <div id="win" class="window">
        <div class="bar" id="winH">
            <span id="wt">Cửa sổ</span>
            <div class="btns">
                <span onclick="minW()">-</span>
                <span onclick="maxW()">🟦</span>
                <span style="color:red;" onclick="closeW()">X</span>
            </div>
        </div>
        <div id="wc" style="padding:20px; font-size:18px; color: #333;"></div>
    </div>
</div>

<div id="start">
    <h2 style="margin-bottom: 30px;">START MENU</h2>
    <div class="grid">
        <div class="app" onclick="openW('Edge', '://bing.com đã từ chối kết nối.')">
            <img src="https://icons8.com"><br>Edge</div>
        <div class="app" onclick="openW('GitHub', '://github.com đã từ chối kết nối.')">
            <img src="https://icons8.com"><br>GitHub</div>
        <div class="app" onclick="openW('Store', 'chưa có gì ở đây cả😉')">
            <img src="https://icons8.com"><br>Store</div>
        <div class="app" onclick="openW('Explorer', 'no files')">
            <img src="https://icons8.com"><br>Explorer</div>
    </div>
    
    <div class="user-footer">
        <div class="user-name">👩‍💻 minh234</div>
        <div style="display:flex; gap:10px;">
            <button onclick="sd()" style="padding:5px 10px; cursor:pointer;">Shutdown</button>
            <button onclick="alert('error')" style="padding:5px 10px; cursor:pointer;">Restart</button>
            <button onclick="alert('error')" style="padding:5px 10px; cursor:pointer;">Sleep</button>
        </div>
    </div>
    <p onclick="tk()" style="margin-top:30px; cursor:pointer; color:#00ff00;">[ Back to Desktop ]</p>
</div>

<div id="taskbar">
    <div class="search-area">
        🔍 <input type="text" placeholder="Search minh234...">
    </div>
    <div class="task-center">
        <!-- Logo Win 11 chuẩn -->
        <img src="https://icons8.com" class="t-icon" onclick="tk()">
        <img src="https://icons8.com" class="t-icon" onclick="openW('Edge', '://bing.com đã từ chối kết nối.')">
        <img src="https://icons8.com" class="t-icon" onclick="openW('Explorer', 'no files')">
        <img src="https://icons8.com" class="t-icon" onclick="openW('Store', 'chưa có gì ở đây cả😉')">
    </div>
</div>

<div id="sh-screen">Shutting down...</div>

<script>
    setTimeout(() => {
        document.getElementById('boot').style.display='none';
        document.getElementById('desktop').style.display='block';
        document.getElementById('taskbar').style.display='flex';
    }, 3000);

    function tk() {
        let m = document.getElementById('start');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function openW(t, c) {
        let w = document.getElementById('win');
        w.style.display='flex';
        w.style.width='450px'; w.style.height='300px';
        w.style.top='80px'; w.style.left='80px';
        document.getElementById('wt').innerText = t;
        document.getElementById('wc').innerText = c;
        document.getElementById('start').style.display='none';
    }

    function closeW() { document.getElementById('win').style.display='none'; }
    
    function maxW() {
        let w = document.getElementById('win');
        if (w.style.width === '100%') {
            w.style.width = '450px'; w.style.height = '300px';
            w.style.top = '80px'; w.style.left = '80px';
        } else {
            w.style.width = '100%'; w.style.height = 'calc(100vh - 50px)';
            w.style.top = '0'; w.style.left = '0';
        }
    }

    function minW() { document.getElementById('win').style.display='none'; alert('Cửa sổ đã thu nhỏ!'); }

    function sd() {
        document.getElementById('sh-screen').style.display='flex';
        setTimeout(() => { location.reload(); }, 3000);
    }

    var win = document.getElementById("win");
    var header = document.getElementById("winH");
    header.onmousedown = function(e) {
        var ox = e.clientX - win.offsetLeft;
        var oy = e.clientY - win.offsetTop;
        document.onmousemove = function(e) {
            win.style.left = (e.clientX - ox) + "px";
            win.style.top = (e.clientY - oy) + "px";
        };
        document.onmouseup = function() { document.onmousemove = null; };
    };
</script>
</body>
</html>
