<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Windows Minh-Nexus Pro</title>
    <style>
        body { margin: 0; background: #004a99; font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; color: white; }
        #desktop { height: calc(100vh - 50px); padding: 20px; position: relative; }
        .desktop-icon { width: 80px; text-align: center; cursor: pointer; margin-bottom: 20px; }
        .icon-img { font-size: 40px; display: block; }

        /* Cửa sổ bật ra */
        .window { position: absolute; top: 15%; left: 25%; width: 50%; height: 50%; background: white; border-radius: 8px; display: none; flex-direction: column; color: black; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #999; }
        .title-bar { background: #f1f1f1; padding: 5px 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px 8px 0 0; border-bottom: 1px solid #ccc; }
        .controls { display: flex; gap: 12px; font-weight: bold; padding-right: 5px; }
        .content { padding: 20px; flex: 1; font-family: Arial, sans-serif; font-size: 18px; }

        /* Start Menu Full Screen */
        #start-menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 100; flex-direction: column; align-items: center; padding-top: 50px; }
        .start-apps { display: grid; grid-template-columns: repeat(2, 150px); gap: 20px; margin-bottom: 50px; }
        .app-item { cursor: pointer; text-align: center; }
        .power-btns { display: flex; gap: 20px; }
        .power-btn { padding: 10px 20px; border: 1px solid white; cursor: pointer; min-width: 80px; text-align: center; }

        /* Taskbar Win 11 */
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; gap: 20px; }
        .task-icon { font-size: 30px; cursor: pointer; }

        #black-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; z-index: 1000; justify-content: center; align-items: center; font-size: 30px; }
    </style>
</head>
<body>

    <div id="desktop">
        <!-- Recycle Bin trên màn hình -->
        <div class="desktop-icon" onclick="openWin('Recycle Bin', 'no times')">
            <span class="icon-img">🗑️</span> Recycle Bin
        </div>

        <!-- Khung cửa sổ chung -->
        <div id="win" class="window">
            <div class="title-bar">
                <span id="win-title">Cửa sổ</span>
                <div class="controls">
                    <span style="cursor:default;">⬜</span> <span style="cursor:default;">-</span> <span style="color:red; cursor:pointer;" onclick="closeWin()">X</span>
                </div>
            </div>
            <div class="content" id="win-content"></div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <h1>START MENU</h1>
        <div class="start-apps">
            <div class="app-item" onclick="openWin('Edge', '://bing.com đã từ chối kết nối.')"><span style="font-size:40px;">🌐</span><br>Edge</div>
            <div class="app-item" onclick="openWin('GitHub', '://github.com đã từ chối kết nối.')"><span style="font-size:40px;">📂</span><br>GitHub</div>
            <div class="app-item" onclick="openWin('Store', 'chưa có gì ở đây cả😉')"><span style="font-size:40px;">🛒</span><br>Store</div>
            <div class="app-item" onclick="openWin('Explorer', 'no files')"><span style="font-size:40px;">📁</span><br>Explorer</div>
        </div>
        <div class="power-btns">
            <div class="power-btn" onclick="shutdown()">Shutdown</div>
            <div class="power-btn" onclick="alert('error')">Restart</div>
            <div class="power-btn" onclick="alert('error')">Sleep</div>
        </div>
        <p style="margin-top:30px; cursor:pointer; color:cyan;" onclick="toggleStart()">[ Đóng Menu ]</p>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <span class="task-icon" onclick="toggleStart()">🪟</span>
        <span class="task-icon" onclick="openWin('Edge', '://bing.com đã từ chối kết nối.')">🌐</span>
        <span class="task-icon" onclick="openWin('Explorer', 'no files')">📁</span>
        <span class="task-icon" onclick="openWin('Store', 'chưa có gì ở đây cả😉')">🛒</span>
    </div>

    <!-- Màn hình đen khi tắt máy -->
    <div id="black-screen">SHUTDOWN...</div>

    <script>
        function toggleStart() {
            let menu = document.getElementById('start-menu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        function openWin(title, message) {
            document.getElementById('win').style.display = 'flex';
            document.getElementById('win-title').innerText = title;
            document.getElementById('win-content').innerText = message;
            document.getElementById('start-menu').style.display = 'none';
        }

        function closeWin() {
            document.getElementById('win').style.display = 'none';
        }

        function shutdown() {
            document.getElementById('black-screen').style.display = 'flex';
            setTimeout(() => { location.reload(); }, 3000);
        }
    </script>
</body>
</html>
