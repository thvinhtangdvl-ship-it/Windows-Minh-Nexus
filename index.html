<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Windows Minh-Nexus</title>
    <style>
        /* Nền Vàng + Hồng theo ý sếp */
        body { margin: 0; background: linear-gradient(135deg, #ffcc00, #ff66cc); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        
        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 3000; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; }
        
        #desktop { height: calc(100vh - 50px); padding: 20px; position: relative; display: none; }
        .desktop-item { width: 100px; text-align: center; cursor: pointer; color: white; font-weight: bold; text-shadow: 2px 2px 4px black; }
        .icon-box { font-size: 40px; margin-bottom: 5px; display: block; }

        /* Cửa sổ có nút điều khiển hoạt động */
        .window { position: absolute; top: 100px; left: 100px; width: 450px; height: 300px; background: white; border-radius: 8px; display: none; flex-direction: column; color: black; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid #999; z-index: 100; }
        .title-bar { background: #f0f0f0; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: move; border-radius: 8px 8px 0 0; }
        .controls span { cursor: pointer; padding: 0 8px; font-weight: bold; }
        
        /* Menu Start có nền Minecraft */
        #start-menu { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('https://wallpaperaccess.com') center/cover;
            display: none; z-index: 1000; flex-direction: column; align-items: center; padding-top: 50px; 
        }
        #start-menu::after { content: ""; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: -1; }

        .start-apps { display: grid; grid-template-columns: repeat(2, 140px); gap: 20px; color: white; }
        .app-item { cursor: pointer; text-align: center; padding: 10px; border: 1px solid rgba(255,255,255,0.3); }

        /* Taskbar có thanh tìm kiếm */
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.8); display: none; align-items: center; padding: 0 10px; box-sizing: border-box; }
        #task-center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .search-bar { background: white; border-radius: 4px; padding: 5px 10px; width: 150px; color: #666; font-size: 14px; margin-right: 20px; cursor: text; }
        .task-icon { font-size: 24px; cursor: pointer; color: white; }

        #shutdown-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; z-index: 4000; justify-content: center; align-items: center; font-size: 35px; color: white; }
    </style>
</head>
<body>

    <div id="boot-screen">Starting windows minh nexus...</div>

    <div id="desktop">
        <div class="desktop-item" onclick="openWin('Recycle Bin', 'no times')">
            <span class="icon-box">🗑️</span> Recycle Bin
        </div>

        <div id="win" class="window">
            <div class="title-bar" id="winHeader">
                <span id="win-title">Cửa sổ</span>
                <div class="controls">
                    <span onclick="alert('Minh Nexus: Đã thu nhỏ')">-</span> 
                    <span onclick="alert('Minh Nexus: Đã phóng to')">🟦</span> 
                    <span style="color:red;" onclick="closeWin()">X</span>
                </div>
            </div>
            <div class="content" id="win-content"></div>
        </div>
    </div>

    <div id="start-menu">
        <h1 style="color: #ffcc00;">MINECRAFT START MENU</h1>
        <div class="start-apps">
            <div class="app-item" onclick="openWin('Edge', '://bing.com đã từ chối kết nối.')">🌐<br>Edge</div>
            <div class="app-item" onclick="openWin('GitHub', '://github.com đã từ chối kết nối.')">📂<br>GitHub</div>
            <div class="app-item" onclick="openWin('Store', 'chưa có gì ở đây cả😉')">🛒<br>Store</div>
            <div class="app-item" onclick="openWin('Explorer', 'no files')">📁<br>Explorer</div>
        </div>
        <div style="margin-top:30px; display:flex; gap:10px;">
            <button onclick="shutDown()" style="background:red; color:white; padding:10px;">Shutting down</button>
            <button onclick="alert('error')" style="padding:10px;">Restart</button>
        </div>
        <p onclick="toggleStart()" style="cursor:pointer; color:#00ff00; font-weight:bold;">[ Back to Start Menu ]</p>
    </div>

    <div id="taskbar">
        <div class="search-bar">🔍 Type to search...</div>
        <div id="task-center">
            <span class="task-icon" onclick="toggleStart()">🪟</span>
            <span class="task-icon" onclick="openWin('Edge', '://bing.com đã từ chối kết nối.')">🌐</span>
            <span class="task-icon" onclick="openWin('Explorer', 'no files')">📁</span>
            <span class="task-icon" onclick="openWin('Store', 'chưa có gì ở đây cả😉')">🛒</span>
        </div>
    </div>

    <div id="shutdown-screen">Shutting down...</div>

    <script>
        setTimeout(() => {
            document.getElementById('boot-screen').style.display = 'none';
            document.getElementById('desktop').style.display = 'block';
            document.getElementById('taskbar').style.display = 'flex';
        }, 3000);

        function toggleStart() {
            let m = document.getElementById('start-menu');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function openWin(t, c) {
            document.getElementById('win').style.display = 'flex';
            document.getElementById('win-title').innerText = t;
            document.getElementById('win-content').innerText = c;
            document.getElementById('start-menu').style.display = 'none';
        }

        function closeWin() { document.getElementById('win').style.display = 'none'; }

        function shutDown() {
            document.getElementById('shutdown-screen').style.display = 'flex';
            setTimeout(() => { location.reload(); }, 3000);
        }

        // Kéo thả
        dragElement(document.getElementById("win"));
        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            document.getElementById("winHeader").onmousedown = dragMouseDown;
            function dragMouseDown(e) { e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY; document.onmouseup = closeDragElement; document.onmousemove = elementDrag; }
            function elementDrag(e) { e.preventDefault(); pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY; pos3 = e.clientX; pos4 = e.clientY; elmnt.style.top = (elmnt.offsetTop - pos2) + "px"; elmnt.style.left = (elmnt.offsetLeft - pos1) + "px"; }
            function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }
        }
    </script>
</body>
</html>
