<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Windows Minh-Nexus Pro</title>
    <style>
        /* Nền Vàng Hồng chuẩn gu sếp */
        body { margin: 0; background: linear-gradient(135deg, #ffcc00, #ff66cc); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        
        /* Màn hình khởi động */
        #boot { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; font-size: 25px; }
        
        #desktop { height: calc(100vh - 50px); padding: 20px; display: none; position: relative; }
        .item { width: 90px; text-align: center; color: white; font-weight: bold; cursor: pointer; text-shadow: 2px 2px black; }
        .item img { width: 50px; height: 50px; display: block; margin: 0 auto 5px; }

        /* Cửa sổ kéo thả có nút điều khiển */
        .window { position: absolute; top: 80px; left: 80px; width: 450px; height: 300px; background: white; border-radius: 8px; display: none; flex-direction: column; color: black; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; border: 1px solid #777; }
        .bar { background: #eee; padding: 10px; display: flex; justify-content: space-between; cursor: move; border-radius: 8px 8px 0 0; }
        .btns span { cursor: pointer; padding: 0 10px; font-weight: bold; font-size: 18px; }

        /* Taskbar có thanh tìm kiếm gõ được */
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.85); display: none; align-items: center; padding: 0 15px; box-sizing: border-box; }
        .search-box { background: white; border-radius: 4px; padding: 5px 10px; width: 200px; display: flex; align-items: center; margin-right: 20px; }
        .search-box input { border: none; outline: none; width: 100%; font-size: 14px; }
        .task-center { flex: 1; display: flex; justify-content: center; gap: 20px; }
        .task-icon { width: 32px; height: 32px; cursor: pointer; transition: 0.2s; }
        .task-icon:hover { transform: scale(1.2); }

        /* Start Menu nền Minecraft */
        #start { position: fixed; inset: 0; background: url('https://wallpaperaccess.com') center/cover; display: none; z-index: 1000; flex-direction: column; align-items: center; padding-top: 50px; color: white; }
        #start::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: -1; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 30px; text-align: center; }
        .app { padding: 10px; cursor: pointer; transition: 0.2s; }
        .app img { width: 50px; height: 50px; margin-bottom: 5px; }

        .power-section { display: flex; gap: 15px; margin-top: 20px; }
        .p-btn { padding: 10px 20px; border: 1px solid white; cursor: pointer; background: rgba(255,255,255,0.1); }
        .p-btn:hover { background: white; color: black; }

        #sh-screen { position: fixed; inset: 0; background: black; display: none; z-index: 10000; justify-content: center; align-items: center; font-size: 35px; color: white; }
    </style>
</head>
<body>

<div id="boot">Starting windows minh nexus...</div>

<div id="desktop">
    <div class="item" onclick="openW('Recycle Bin', 'no times')">
        <img src="https://icons8.com">Recycle Bin
    </div>

    <div id="win" class="window">
        <div class="bar" id="winH">
            <span id="wt">Cửa sổ</span>
            <div class="btns">
                <span onclick="alert('Minh Nexus: -')">-</span>
                <span onclick="alert('Minh Nexus: 🟦')">🟦</span>
                <span style="color:red;" onclick="closeW()">X</span>
            </div>
        </div>
        <div id="wc" style="padding:20px; font-size:18px; color: #333;"></div>
    </div>
</div>

<div id="start">
    <h1 style="color:#ffcc00; text-shadow: 2px 2px black;">MINECRAFT START</h1>
    <div class="grid">
        <div class="app" onclick="openW('Edge', '://bing.com đã từ chối kết nối.')">
            <img src="https://icons8.com"><br>Edge</div>
        <div class="app" onclick="openW('GitHub', '://github.com đã từ chối kết nối.')">
            <img src="https://icons8.com"><br>GitHub</div>
        <div class="app" onclick="openW('Store', 'chưa có gì ở đây cả😉')">
            <img src="https://icons8.com"><br>Store</div>
        <div class="app" onclick="openW('Explorer', 'no files')">
            <img src="https://icons8.com"><br>Explorer</div>
    </div>
    <div class="power-section">
        <div class="p-btn" onclick="sd()">Shutting down</div>
        <div class="p-btn" onclick="alert('error')">Restart</div>
        <div class="p-btn" onclick="alert('error')">Sleep</div>
    </div>
    <p onclick="tk()" style="margin-top:30px; cursor:pointer; color:#00ff00;">[ Back to Start Menu ]</p>
</div>

<div id="taskbar">
    <div class="search-box">
        <span>🔍</span>
        <input type="text" placeholder="Search Minh Nexus...">
    </div>
    <div class="task-center">
        <img src="https://icons8.com" class="task-icon" onclick="tk()">
        <img src="https://icons8.com" class="task-icon" onclick="openW('Edge', '://bing.com đã từ chối kết nối.')">
        <img src="https://icons8.com" class="task-icon" onclick="openW('Explorer', 'no files')">
        <img src="https://icons8.com" class="task-icon" onclick="openW('Store', 'chưa có gì ở đây cả😉')">
    </div>
</div>

<div id="sh-screen">Shutting down...</div>

<script>
    setTimeout(() => {
        document.getElementById('boot').style.display='none';
        document.getElementById('desktop').style.display='block';
        document.getElementById('taskbar').style.display='flex';
    }, 3000);

    function tk() {
        let m = document.getElementById('start');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function openW(t, c) {
        document.getElementById('win').style.display='flex';
        document.getElementById('wt').innerText = t;
        document.getElementById('wc').innerText = c;
        document.getElementById('start').style.display='none';
    }

    function closeW() { document.getElementById('win').style.display='none'; }

    function sd() {
        document.getElementById('sh-screen').style.display='flex';
        setTimeout(() => { location.reload(); }, 3000);
    }

    // Kéo thả thần thánh
    var win = document.getElementById("win");
    var header = document.getElementById("winH");
    header.onmousedown = function(e) {
        var offset = { x: e.clientX - win.offsetLeft, y: e.clientY - win.offsetTop };
        document.onmousemove = function(e) {
            win.style.left = (e.clientX - offset.x) + "px";
            win.style.top = (e.clientY - offset.y) + "px";
        };
        document.onmouseup = function() { document.onmousemove = null; };
    };
</script>
</body>
</html>
