<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Windows Minh-Nexus - minh234</title>
    <style>
        body { margin: 0; background: linear-gradient(135deg, #ffcc00, #ff66cc); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        #boot { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; font-size: 25px; flex-direction: column; }
        #desktop { height: calc(100vh - 50px); padding: 20px; display: none; position: relative; }
        .item { width: 90px; text-align: center; color: white; font-weight: bold; cursor: pointer; text-shadow: 2px 2px black; font-size: 13px; }
        .icon-art { font-size: 45px; display: block; margin-bottom: 5px; }

        /* Cửa sổ */
        .window { position: absolute; top: 80px; left: 80px; width: 450px; height: 300px; background: white; border-radius: 12px; display: none; flex-direction: column; color: black; box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 100; border: 1px solid #777; transition: 0.2s; }
        .bar { background: #f0f0f0; padding: 10px; display: flex; justify-content: space-between; cursor: move; border-radius: 12px 12px 0 0; }
        .btns span { cursor: pointer; padding: 0 12px; font-weight: bold; font-size: 18px; }

        /* Start Menu chuẩn 11 */
        #start { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; z-index: 1000; flex-direction: column; align-items: center; padding-top: 50px; color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center; }
        .app { border: 1px solid white; padding: 15px; width: 110px; cursor: pointer; background: rgba(255,255,255,0.1); }
        .user-footer { margin-top: 40px; border-top: 1px solid #555; width: 350px; padding-top: 20px; display: flex; justify-content: space-between; align-items: center; }

        #taskbar { position: fixed; bottom: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.85); display: none; align-items: center; padding: 0 15px; box-sizing: border-box; }
        .task-center { flex: 1; display: flex; justify-content: center; gap: 30px; font-size: 28px; color: white; }

        #sh-screen { position: fixed; inset: 0; background: black; display: none; z-index: 10000; justify-content: center; align-items: center; font-size: 35px; color: white; }
    </style>
</head>
<body>

<div id="boot">Starting windows minh nexus...</div>

<div id="desktop">
    <div class="item" onclick="openW('Recycle Bin', 'no times')">
        <span class="icon-art">🗑️</span>Recycle Bin
    </div>

    <div id="win" class="window">
        <div class="bar" id="winH">
            <span id="wt">Cửa sổ</span>
            <div class="btns">
                <span onclick="minW()">-</span><span onclick="maxW()">🟦</span><span style="color:red;" onclick="closeW()">X</span>
            </div>
        </div>
        <div id="wc" style="padding:20px; font-size:20px;"></div>
    </div>
</div>

<div id="start">
    <h1 style="color:#ffcc00;">START MENU</h1>
    <div class="grid">
        <div class="app" onclick="openW('Edge', '://bing.com đã từ chối kết nối.')">🌐<br>Edge</div>
        <!-- Settings ở Menu Start đây sếp -->
        <div class="app" onclick="openSettings()">⚙️<br>Settings</div>
        <div class="app" onclick="openW('Store', 'chưa có gì ở đây cả😉')">🛒<br>Store</div>
        <div class="app" onclick="openW('Explorer', 'no files')">📁<br>Explorer</div>
    </div>
    <div class="user-footer">
        <div style="font-size:20px;">👩‍💻 minh234</div>
        <div style="display:flex; gap:10px;">
            <button onclick="sd()" style="background:red; color:white; border:none; padding:8px; cursor:pointer;">Shutdown</button>
            <button onclick="alert('error')" style="padding:8px; cursor:pointer;">Restart</button>
            <button onclick="alert('error')" style="padding:8px; cursor:pointer;">Sleep</button>
        </div>
    </div>
    <p onclick="tk()" style="margin-top:20px; cursor:pointer; color:#00ff00;">[ Back to Desktop ]</p>
</div>

<div id="taskbar">
    <div style="background:white; border-radius:5px; padding:5px 10px; width:150px; color:#666; font-size:12px; position:absolute; left:15px;">🔍 Type to search...</div>
    <div class="task-center">
        <span onclick="tk()" style="cursor:pointer;">🟦</span>
        <span onclick="openW('Edge', '://bing.com đã từ chối kết nối.')" style="cursor:pointer;">🌐</span>
        <span onclick="openSettings()" style="cursor:pointer;">⚙️</span>
        <span onclick="openW('Store', 'chưa có gì ở đây cả😉')" style="cursor:pointer;">🛒</span>
    </div>
</div>

<div id="sh-screen">Shutting down...</div>

<script>
    setTimeout(() => { document.getElementById('boot').style.display='none'; document.getElementById('desktop').style.display='block'; document.getElementById('taskbar').style.display='flex'; }, 3000);
    function tk() { let m = document.getElementById('start'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
    
    function openW(t, c) { 
        let w = document.getElementById('win'); 
        w.style.display='flex'; 
        document.getElementById('wt').innerText = t; 
        document.getElementById('wc').innerHTML = c; 
        document.getElementById('start').style.display='none'; 
    }

    function openSettings() {
        let content = `
            <div style="color:black;">
                <h3 style="border-bottom:1px solid #ccc; padding-bottom:10px;">Settings</h3>
                <div onclick="openUpdate()" style="padding:10px; background:#f0f0f0; margin-top:10px; cursor:pointer; border-radius:5px;">🔄 Windows Update</div>
                <div style="padding:10px; color:#999;">🖥️ System</div>
                <div style="padding:10px; color:#999;">🎨 Personalization</div>
            </div>
        `;
        openW('Settings', content);
    }

    function openUpdate() {
        document.getElementById('wc').innerHTML = `
            <div style="text-align:center; padding-top:30px;">
                <span style="font-size:50px;">❌</span>
                <h2 style="color:red;">no update</h2>
                <p>Windows Minh-Nexus của sếp đang ở bản mới nhất.</p>
                <button onclick="openSettings()" style="padding:5px 15px; cursor:pointer;">Quay lại</button>
            </div>
        `;
    }

    function closeW() { document.getElementById('win').style.display='none'; }
    function maxW() {
        let w = document.getElementById('win');
        if (w.style.width === '100%') { w.style.width='450px'; w.style.height='300px'; w.style.top='80px'; w.style.left='80px'; }
        else { w.style.width='100%'; w.style.height='calc(100vh - 50px)'; w.style.top='0'; w.style.left='0'; }
    }
    function minW() { document.getElementById('win').style.display='none'; }
    function sd() { document.getElementById('sh-screen').style.display='flex'; setTimeout(() => { location.reload(); }, 3000); }
    
    var win = document.getElementById("win"); var header = document.getElementById("winH");
    header.onmousedown = function(e) { var ox = e.clientX - win.offsetLeft; var oy = e.clientY - win.offsetTop; document.onmousemove = function(e) { win.style.left = (e.clientX - ox) + "px"; win.style.top = (e.clientY - oy) + "px"; }; document.onmouseup = function() { document.onmousemove = null; }; };
</script>
</body>
</html>
