<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Windows Minh-Nexus Pro</title>
    <style>
        body {
            margin: 0;
            background: url('https://freepik.com') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* Thùng rác trên Desktop */
        #desktop {
            padding: 20px;
            height: calc(100vh - 50px);
        }
        .icon-desktop {
            width: 70px;
            text-align: center;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }
        .icon-desktop img { width: 50px; display: block; margin: 0 auto 5px; }

        /* Taskbar Windows 11 (Căn giữa) */
        #taskbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center; /* Windows 11 style */
            align-items: center;
            gap: 10px;
        }

        .task-icon {
            width: 36px;
            height: 36px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .task-icon:hover { transform: scale(1.2); }

        /* Nút Start Windows 10 (Hình vuông) */
        .start-btn {
            background-image: url('https://wikimedia.org'); /* Tạm thời lấy logo MS */
            background-size: contain;
            background-repeat: no-repeat;
            width: 30px;
            height: 30px;
        }

        /* Menu Start Full Màn Hình */
        #start-menu {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none; /* Ẩn đi khi chưa bấm */
            z-index: 100;
            color: white;
            text-align: center;
            padding-top: 100px;
        }
    </style>
</head>
<body>

    <div id="desktop">
        <div class="icon-desktop" onclick="alert('Thùng rác trống rỗng!')">
            <img src="https://flaticon.com" alt="Recycle Bin">
            Recycle Bin
        </div>
    </div>

    <!-- Menu Start Full Screen -->
    <div id="start-menu" onclick="this.style.display='none'">
        <h1>WINDOWS 10 START MENU (FULL SCREEN)</h1>
        <p>Chào mừng Đỗ Đức Minh lớp 3B</p>
        <div style="display: grid; grid-template-columns: repeat(4, 100px); justify-content: center; gap: 20px; padding: 20px;">
            <div style="background: #0078d7; width: 100px; height: 100px;">Game</div>
            <div style="background: #0078d7; width: 100px; height: 100px;">Học tập</div>
            <div style="background: #0078d7; width: 100px; height: 100px;">Ảnh</div>
            <div style="background: #0078d7; width: 100px; height: 100px;">Nhạc</div>
        </div>
        <p>(Bấm vào bất cứ đâu để đóng)</p>
    </div>

    <div id="taskbar">
        <!-- Start hình Windows 10 -->
        <img src="https://flaticon.com" class="task-icon" onclick="document.getElementById('start-menu').style.display='block'">
        
        <!-- Các icon không chữ -->
        <img src="https://flaticon.com" class="task-icon" title="Edge">
        <img src="https://flaticon.com" class="task-icon" title="File Explorer">
        <img src="https://flaticon.com" class="task-icon" title="Store">
    </div>

</body>
</html>
