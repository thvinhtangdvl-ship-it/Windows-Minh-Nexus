<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Windows Minh-Nexus Pro</title>
    <style>
        body { margin: 0; background: linear-gradient(135deg, #ffcc00, #ff66cc); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        #boot { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; font-size: 25px; }
        #desktop { height: calc(100vh - 50px); padding: 20px; display: none; position: relative; }
        
        /* Icon Recycle Bin xịn */
        .item { width: 90px; text-align: center; color: white; font-weight: bold; cursor: pointer; text-shadow: 2px 2px black; font-size: 13px; }
        .icon-art { font-size: 50px; display: block; margin-bottom: 5px; }

        /* Cửa sổ Windows 11 */
        .window { position: absolute; top: 80px; left: 80px; width: 450px; height: 300px; background: white; border-radius: 12px; display: none; flex-direction: column; color: black; box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 100; border: 1px solid #ccc; transition: 0.2s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        .bar { background: #f9f9f9; padding: 10px 15px; display: flex; justify-content: space-between; cursor: move; border-radius: 12px 12px 0 0; }
        .btns span { cursor: pointer; padding: 0 10px; font-weight: bold; font-size: 16px; }
        .btns span:hover { background: #eee; border-radius: 4px; }

        /* Taskbar Windows 11 với thanh tìm kiếm gõ được */
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 50px; background: rgba(255,255,255,0.2); backdrop-filter: blur(20px); display: none; align-items: center; padding: 0 15px; box-sizing: border-box; }
        .search-area { background: rgba(255,255,255,0.8); border-radius: 20px; padding: 5px 15px; width: 180px; display: flex; align-items: center; margin-right: 20px; border: 1px solid #ccc; }
        .search-area input { border: none; outline: none; background: transparent; width: 100%; font-size: 14px; }
        .task-center { flex: 1; display: flex; justify-content: center; gap: 20px; font-size: 30px; }
        .win-logo { width: 32px; cursor: pointer; transition: 0.2s; }
        .win-logo:hover { transform: scale(1.1); }

        /* Start Menu Minecraft */
        #start { position: fixed; inset: 0; background: url('https://wallpaperaccess.com') center/cover; display: none; z-index: 1000; flex-direction: column; align-items: center; padding-top: 50px; color: white; }
        #start::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.7); z-index: -1; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center; }
        .app { border: 1px solid rgba(255,255,255,0.3); padding: 15px; width: 110px; background: rgba(0,0,0,0.3); cursor: pointer; }

        #sh-screen { position: fixed; inset: 0; background: black; display: none; z-index: 10000; justify-content: center; align-items: center; font-size: 35px; color: white; }
    </style>
</head>
<body>

<div id="boot">Starting windows minh nexus...</div>

<div id="desktop">
    <div class="item" onclick="openW('Recycle Bin', 'no times')">
        <span class="icon-art">🗑️</span>Recycle Bin
    </div>

    <div id="win" class="window">
        <div class="bar" id="winH">
            <span id="wt">Cửa sổ</span>
            <div class="btns">
                <span onclick="minW()">-</span>
                <span onclick="maxW()">🟦</span>
                <span style="color:red;" onclick="closeW()">X</span>
            </div>
        </div>
        <div id="wc" style="padding:20px; font-size:18px; color: #333;"></div>
    </div>
</div>

<div id="start">
    <h1 style="color:#ffcc00; text-shadow: 2px 2px black;">MINECRAFT START</h1>
    <div class="grid">
        <div class="app" onclick="openW('Edge', '://bing.com đã từ chối kết nối.')">🌐<br>Edge</div>
        <div class="app" onclick="openW('GitHub', '://github.com đã từ chối kết nối.')">📂<br>GitHub</div>
        <div class="app" onclick="openW('Store', 'chưa có gì ở đây cả😉')">🛒<br>Store</div>
        <div class="app" onclick="openW('Explorer', 'no files')">📁<br>Explorer</div>
    </div>
    <div style="margin-top:40px; display:flex; gap:15px;">
        <button onclick="sd()" style="padding:10px 20px; background: #e81123; color: white; border: none; cursor: pointer;">Shutting down</button>
        <button onclick="alert('error')" style="padding:10px 20px; cursor: pointer;">Restart</button>
        <button onclick="alert('error')" style="padding:10px 20px; cursor: pointer;">Sleep</button>
    </div>
    <p onclick="tk()" style="margin-top:30px; cursor:pointer; color:#00ff00;">[ Back to Start Menu ]</p>
</div>

<div id="taskbar">
    <div class="search-area">
        <input type="text" placeholder="🔍 Search Minh...">
    </div>
    <div class="task-center">
        <!-- Logo Windows 11 xịn dùng mã SVG cực bền -->
        <svg class="win-logo" onclick="tk()" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
            <path d="M1 1H11V11H1V1Z" fill="#00A4EF"/><path d="M13 1H23V11H13V1Z" fill="#00A4EF"/>
            <path d="M1 13H11V23H1V13Z" fill="#00A4EF"/><path d="M13 13H23V23H13V13Z" fill="#00A4EF"/>
        </svg>
        <span style="cursor:pointer;" onclick="openW('Edge', '://bing.com đã từ chối kết nối.')">🌐</span>
        <span style="cursor:pointer;" onclick="openW('Explorer', 'no files')">📁</span>
        <span style="cursor:pointer;" onclick="openW('Store', 'chưa có gì ở đây cả😉')">🛒</span>
    </div>
</div>

<div id="sh-screen">Shutting down...</div>

<script>
    setTimeout(() => {
        document.getElementById('boot').style.display='none';
        document.getElementById('desktop').style.display='block';
        document.getElementById('taskbar').style.display='flex';
    }, 3000);

    function tk() {
        let m = document.getElementById('start');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function openW(t, c) {
        let w = document.getElementById('win');
        w.style.display='flex';
        document.getElementById('wt').innerText = t;
        document.getElementById('wc').innerText = c;
        document.getElementById('start').style.display='none';
    }

    function closeW() { document.getElementById('win').style.display='none'; }
    
    // Sửa lỗi nút 🟦: Bấm 1 lần phóng to, bấm lần nữa thu nhỏ
    function maxW() {
        let w = document.getElementById('win');
        if (w.style.width === '100%') {
            w.style.width = '450px'; 
            w.style.height = '300px';
            w.style.top = '80px'; 
            w.style.left = '80px';
        } else {
            w.style.width = '100%'; 
            w.style.height = 'calc(100vh - 50px)';
            w.style.top = '0'; 
            w.style.left = '0';
        }
    }

    function minW() { 
        document.getElementById('win').style.display = 'none'; 
        alert('Cửa sổ đã thu nhỏ xuống Taskbar của sếp Minh!');
    }

    function sd() {
        document.getElementById('sh-screen').style.display='flex';
        setTimeout(() => { location.reload(); }, 3000);
    }

    // Kéo thả cửa sổ mượt mà
    var win = document.getElementById("win");
    var header = document.getElementById("winH");
    header.onmousedown = function(e) {
        var ox = e.clientX - win.offsetLeft;
        var oy = e.clientY - win.offsetTop;
        document.onmousemove = function(e) {
            win.style.left = (e.clientX - ox) + "px";
            win.style.top = (e.clientY - oy) + "px";
        };
        document.onmouseup = function() { document.onmousemove = null; };
    };
</script>
</body>
</html>
