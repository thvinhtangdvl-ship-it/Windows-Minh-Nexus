<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Windows Minh-Nexus OS</title>
    <style>
        body {
            margin: 0;
            background: #000; /* Nền đen cho chuyên nghiệp */
            color: #00ff00; /* Chữ màu xanh giống Hacker */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Hiệu ứng tên sếp Minh bay qua bay lại */
        marquee {
            font-size: 30px;
            font-weight: bold;
            background: rgba(0, 0, 255, 0.2);
            padding: 10px;
        }
        #desktop {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a1a1a, #000);
        }
        .window-box {
            width: 90%;
            height: 80%;
            border: 2px solid #00ff00;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
        }
        .title-bar {
            background: #00ff00;
            color: #000;
            padding: 5px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        iframe {
            flex: 1;
            border: none;
            background: white;
        }
        /* Thanh Taskbar dưới cùng */
        #taskbar {
            height: 45px;
            background: #333;
            display: flex;
            align-items: center;
            padding-left: 10px;
        }
        .start-btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 5px 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Chữ bay cho oai -->
    <marquee>🚀 CHÀO MỪNG ĐẾN VỚI WINDOWS MINH-NEXUS - PHÁT TRIỂN BỞI ĐỖ ĐỨC MINH LỚP 3B 🚀</marquee>

    <div id="desktop">
        <div class="window-box">
            <div class="title-bar">
                <span>GitHub_System_v1.0.exe</span>
                <span>[ _ □ X ]</span>
            </div>
            <!-- Chỗ này nhúng GitHub của sếp nè -->
            <iframe src="https://github.com"></iframe>
        </div>
    </div>

    <div id="taskbar">
        <button class="start-btn" onclick="alert('Hệ điều hành của sếp Minh đã sẵn sàng!')">MINH START</button>
        <span style="margin-left: 20px;">Xóm 5 Biện Thượng đang online...</span>
    </div>

</body>
</html>
