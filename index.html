<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Windows Minh-Nexus - minh234</title>
    <style>
        body { margin: 0; background: linear-gradient(135deg, #ffcc00, #ff66cc); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        #boot { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; font-size: 25px; }
        #desktop { height: 100vh; padding: 20px; display: none; position: relative; }
        .item { width: 100px; text-align: center; color: white; cursor: pointer; text-shadow: 1px 1px 3px black; font-size: 13px; }
        .icon-svg { width: 48px; height: 48px; display: block; margin: 0 auto 5px; }
        .window { position: absolute; top: 80px; left: 80px; width: 500px; height: 350px; background: rgba(255,255,255,0.95); backdrop-filter: blur(15px); border-radius: 12px; display: none; flex-direction: column; color: black; box-shadow: 0 10px 40px rgba(0,0,0,0.3); z-index: 100; border: 1px solid #ccc; }
        .bar { padding: 10px 15px; display: flex; justify-content: space-between; cursor: move; border-bottom: 1px solid #ddd; }
        .btns span { cursor: pointer; padding: 0 10px; font-weight: bold; }
        #start { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; z-index: 1000; flex-direction: column; align-items: center; padding-top: 50px; color: white; backdrop-filter: blur(15px); }
        .grid { display: grid; grid-template-columns: repeat(2, 130px); gap: 25px; text-align: center; }
        .app { border: 1px solid rgba(255,255,255,0.2); padding: 15px; cursor: pointer; border-radius: 8px; background: rgba(255,255,255,0.1); }
        .app svg { width: 40px; height: 40px; margin-bottom: 5px; }
        #taskbar-container { position: fixed; bottom: 15px; width: 100%; display: none; justify-content: center; z-index: 2000; }
        #taskbar { background: rgba(255,255,255,0.25); backdrop-filter: blur(20px); padding: 8px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .search-area { background: rgba(255,255,255,0.9); border-radius: 20px; padding: 5px 15px; width: 160px; color: #333; font-size: 13px; border: none; outline: none; }
        .t-icon { width: 32px; height: 32px; cursor: pointer; }
        .user-footer { border-top: 1px solid rgba(255,255,255,0.2); margin-top: 30px; padding-top: 20px; width: 350px; display: flex; justify-content: space-between; align-items: center; }
        #sh-screen { position: fixed; inset: 0; background: black; display: none; z-index: 10000; justify-content: center; align-items: center; font-size: 30px; color: white; }
    </style>
</head>
<body>
<div id="boot">Starting Windows Minh Nexus...</div>
<div id="desktop">
    <div class="item" onclick="openW('Recycle Bin', 'Trống rỗng.')">
        <svg class="icon-svg" viewBox="0 0 48 48" fill="none"><rect x="10" y="12" width="28" height="30" rx="2" fill="#2196F3"/><path d="M16 12V8h16v4M8 12h32" stroke="white" stroke-width="2"/></svg>Recycle Bin
    </div>
    <div id="win" class="window">
        <div class="bar" id="winH"><span id="wt">Cửa sổ</span><div class="btns"><span onclick="minW()">-</span><span onclick="maxW()">🟦</span><span style="color:red;" onclick="closeW()">X</span></div></div>
        <div id="wc" style="padding:20px; font-size:17px;"></div>
    </div>
</div>
<div id="start">
    <h2>START MENU</h2>
    <div class="grid">
        <div class="app" onclick="openW('Explorer', 'Không có tệp nào.')"><svg viewBox="0 0 48 48" fill="none"><path d="M40 12H26l-4-4H8c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h32c2.2 0 4-1.8 4-4V16c0-2.2-1.8-4-4-4z" fill="#FFC107"/></svg><br>Explorer</div>
        <div class="app" onclick="openSettings()"><svg viewBox="0 0 48 48" fill="white"><path d="M38.86 25.95c.08-.64.14-1.29.14-1.95s-.06-1.31-.14-1.95l4.23-3.31c.38-.3.49-.84.24-1.28l-4-6.93c-.25-.43-.77-.61-1.22-.43l-4.98 2.01c-1.03-.79-2.16-1.46-3.38-1.97L29 5.24c-.09-.47-.5-.84-1-.84h-8c-.5 0-.91.37-.99.84l-.75 5.3c-1.22.51-2.35 1.17-3.38 1.97L9.9 10.51c-.45-.18-.97 0-1.22.43l-4 6.93c-.25.43-.14.97.24 1.28l4.22 3.31c-.08.64-.14 1.29-.14 1.95s.06 1.31.14 1.95l-4.22 3.31c-.38.3-.49.84-.24 1.28l4 6.93c.25.43.77.61 1.22.43l4.98-2.01c1.03.79 2.16 1.46 3.38 1.97l.75 5.3c.08.47.49.84.99.84h8c.5 0 .91-.37.99-.84l.75-5.3c1.22-.51 2.35-1.17 3.38-1.97l4.98 2.01c.45.18.97 0 1.22-.43l4-6.93c.25-.43.14-.97-.24-1.28l-4.22-3.31zM24 31c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg><br>Settings</div>
    </div>
    <div class="user-footer"><div>👩‍💻 minh234</div><button onclick="sd()" style="padding:5px 10px; background:red; color:white; border:none; cursor:pointer;">Shutdown</button></div>
    <p onclick="tk()" style="margin-top:20px; cursor:pointer; color:#0ff;">[ Back to Desktop ]</p>
</div>
<div id="taskbar-container"><div id="taskbar">
    <input type="text" class="search-area" placeholder="🔍 Search minh234...">
    <svg class="t-icon" onclick="tk()" viewBox="0 0 24 24" fill="#00A4EF"><path d="M0 0h11.2v11.2H0zM12.8 0H24v11.2H12.8zM0 12.8h11.2V24H0zM12.8 12.8H24V24H12.8z"/></svg>
    <svg class="t-icon" onclick="openW('Explorer', 'Không có tệp nào.')" viewBox="0 0 48 48"><path d="M40 12H26l-4-4H8c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h32c2.2 0 4-1.8 4-4V16c0-2.2-1.8-4-4-4z" fill="#FFC107"/></svg>
</div></div>
<div id="sh-screen">Shutting down...</div>
<script>
    setTimeout(() => { document.getElementById('boot').style.display='none'; document.getElementById('desktop').style.display='block'; document.getElementById('taskbar-container').style.display='flex'; }, 2000);
    function tk() { let m = document.getElementById('start'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
    function openW(t, c) { let w = document.getElementById('win'); w.style.display='flex'; document.getElementById('wt').innerText = t; document.getElementById('wc').innerHTML = c; document.getElementById('start').style.display='none'; }
    function openSettings() { openW('Settings', '<h3>Settings</h3><div onclick="openUp()" style="background:#eee; padding:10px; cursor:pointer;">🔄 Windows Update</div>'); }
    function openUp() { document.getElementById('wc').innerHTML = '<div style="text-align:center; padding-top:30px;"><h2 style="color:red;">❌ no update</h2><p>Windows is up to date.</p><button onclick="openSettings()">Quay lại</button></div>'; }
    function closeW() { document.getElementById('win').style.display='none'; }
    function maxW() { let w = document.getElementById('win'); if (w.style.width === '100%') { w.style.width='500px'; w.style.height='350px'; w.style.top='80px'; w.style.left='80px'; } else { w.style.width='100%'; w.style.height='calc(100vh - 80px)'; w.style.top='0'; w.style.left='0'; } }
    function minW() { document.getElementById('win').style.display='none'; }
    function sd() { document.getElementById('sh-screen').style.display='flex'; setTimeout(() => { location.reload(); }, 2000); }
    var win = document.getElementById("win"); var header = document.getElementById("winH");
    header.onmousedown = function(e) { var ox = e.clientX - win.offsetLeft; var oy = e.clientY - win.offsetTop; document.onmousemove = function(e) { win.style.left = (e.clientX - ox) + "px"; win.style.top = (e.clientY - oy) + "px"; }; document.onmouseup = function() { document.onmousemove = null; }; };
</script>
</body>
</html>
