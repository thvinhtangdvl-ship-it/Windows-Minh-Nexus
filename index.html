<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Windows Minh-Nexus Final</title>
    <style>
        /* Nền Vàng Hồng rực rỡ */
        body { margin: 0; background: linear-gradient(135deg, #ffcc00, #ff66cc); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        
        /* Khởi động oai như sếp muốn */
        #boot { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; font-size: 25px; }
        
        #desktop { height: calc(100vh - 50px); padding: 20px; display: none; position: relative; }
        .item { width: 90px; text-align: center; color: white; font-weight: bold; cursor: pointer; text-shadow: 2px 2px black; }

        /* Cửa sổ kéo thả có nút 🟦 và - hoạt động */
        .window { position: absolute; top: 50px; left: 50px; width: 450px; height: 300px; background: white; border-radius: 8px; display: none; flex-direction: column; color: black; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; border: 1px solid #777; }
        .bar { background: #eee; padding: 10px; display: flex; justify-content: space-between; cursor: move; border-radius: 8px 8px 0 0; }
        .btns span { cursor: pointer; padding: 0 10px; font-weight: bold; font-size: 18px; }

        /* Taskbar có thanh tìm kiếm và Store */
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.85); display: none; align-items: center; padding: 0 15px; box-sizing: border-box; }
        .search { background: white; border-radius: 5px; padding: 5px 15px; width: 180px; color: #555; margin-right: 20px; font-size: 14px; }
        .task-center { flex: 1; display: flex; justify-content: center; gap: 25px; font-size: 28px; color: white; }

        /* Start Menu nền Minecraft */
        #start { position: fixed; inset: 0; background: url('https://wallpaperaccess.com') center/cover; display: none; z-index: 1000; flex-direction: column; align-items: center; padding-top: 50px; color: white; }
        #start::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: -1; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; text-align: center; }
        .app { border: 1px solid white; padding: 15px; width: 100px; cursor: pointer; }

        #sh-screen { position: fixed; inset: 0; background: black; display: none; z-index: 10000; justify-content: center; align-items: center; font-size: 35px; color: white; }
    </style>
</head>
<body>

<div id="boot">Starting windows minh nexus...</div>

<div id="desktop">
    <div class="item" onclick="openW('Recycle Bin', 'no times')"><span style="font-size:50px;">🗑️</span><br>Recycle Bin</div>

    <div id="win" class="window">
        <div class="bar" id="winH">
            <span id="wt">Cửa sổ</span>
            <div class="btns">
                <span onclick="alert('Minh Nexus: Đã thu nhỏ -')">-</span>
                <span onclick="alert('Minh Nexus: Đã phóng to 🟦')">🟦</span>
                <span style="color:red;" onclick="closeW()">X</span>
            </div>
        </div>
        <div id="wc" style="padding:20px; font-size:20px;"></div>
    </div>
</div>

<div id="start">
    <h1 style="color:#ffcc00; text-shadow: 2px 2px black;">MINECRAFT START</h1>
    <div class="grid">
        <div class="app" onclick="openW('Edge', '://bing.com đã từ chối kết nối.')">🌐<br>Edge</div>
        <div class="app" onclick="openW('GitHub', '://github.com đã từ chối kết nối.')">📂<br>GitHub</div>
        <div class="app" onclick="openW('Store', 'chưa có gì ở đây cả😉')">🛒<br>Store</div>
        <div class="app" onclick="openW('Explorer', 'no files')">📁<br>Explorer</div>
    </div>
    <div style="display:flex; gap:20px;">
        <button onclick="sd()" style="background:red; color:white; padding:10px; border:none; cursor:pointer;">Shutting down</button>
        <button onclick="alert('error')" style="padding:10px; cursor:pointer;">Restart</button>
    </div>
    <p onclick="tk()" style="margin-top:30px; cursor:pointer; color:#00ff00;">[ Back to Start Menu ]</p>
</div>

<div id="taskbar">
    <div class="search">🔍 Type to search...</div>
    <div class="task-center">
        <span onclick="tk()" style="cursor:pointer;">🪟</span>
        <span onclick="openW('Edge', '://bing.com đã từ chối kết nối.')" style="cursor:pointer;">🌐</span>
        <span onclick="openW('Explorer', 'no files')" style="cursor:pointer;">📁</span>
        <span onclick="openW('Store', 'chưa có gì ở đây cả😉')" style="cursor:pointer;">🛒</span>
    </div>
</div>

<div id="sh-screen">Shutting down...</div>

<script>
    setTimeout(() => {
        document.getElementById('boot').style.display='none';
        document.getElementById('desktop').style.display='block';
        document.getElementById('taskbar').style.display='flex';
    }, 3000);

    function tk() {
        let m = document.getElementById('start');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function openW(t, c) {
        document.getElementById('win').style.display='flex';
        document.getElementById('wt').innerText = t;
        document.getElementById('wc').innerText = c;
        document.getElementById('start').style.display='none';
    }

    function closeW() { document.getElementById('win').style.display='none'; }

    function sd() {
        document.getElementById('sh-screen').style.display='flex';
        setTimeout(() => { location.reload(); }, 3000);
    }

    drag(document.getElementById("win"));
    function drag(e) {
        var p1=0, p2=0, p3=0, p4=0;
        document.getElementById("winH").onmousedown = function(d) {
            d.preventDefault(); p3=d.clientX; p4=d.clientY;
            document.onmouseup = function() { document.onmouseup=null; document.onmousemove=null; };
            document.onmousemove = function(m) {
                m.preventDefault(); p1=p3-m.clientX; p2=p4-m.clientY; p3=m.clientX; p4=m.clientY;
                e.style.top=(e.offsetTop-p2)+"px"; e.style.left=(e.offsetLeft-p1)+"px";
            };
        };
    }
</script>
</body>
</html>
