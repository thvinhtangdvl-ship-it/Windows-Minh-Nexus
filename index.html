<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Windows Minh-Nexus</title>
    <style>
        body { margin: 0; background: linear-gradient(135deg, #ffcc00, #ff66cc); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        
        /* Màn hình khởi động */
        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 3000; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; }
        
        /* Desktop */
        #desktop { height: calc(100vh - 50px); padding: 20px; position: relative; display: none; }
        .desktop-item { width: 80px; text-align: center; cursor: pointer; color: white; font-weight: bold; text-shadow: 1px 1px 2px black; }
        .desktop-item img { width: 50px; height: 50px; display: block; margin: 0 auto 5px; }

        /* Cửa sổ kéo thả */
        .window { position: absolute; top: 100px; left: 100px; width: 450px; height: 300px; background: white; border-radius: 8px; display: none; flex-direction: column; color: black; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid #999; z-index: 100; }
        .title-bar { background: #f0f0f0; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: move; border-top-left-radius: 8px; border-top-right-radius: 8px; border-bottom: 1px solid #ccc; }
        .controls { display: flex; gap: 15px; align-items: center; }
        .content { padding: 20px; flex: 1; font-size: 18px; overflow: auto; }

        /* Start Menu */
        #start-menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; z-index: 1000; flex-direction: column; align-items: center; padding-top: 60px; color: white; }
        .start-apps { display: grid; grid-template-columns: repeat(2, 140px); gap: 30px; margin-bottom: 50px; }
        .app-item { cursor: pointer; text-align: center; }
        .app-item img { width: 60px; height: 60px; margin-bottom: 10px; }
        .power-btns { display: flex; gap: 20px; }
        .power-btn { padding: 10px 20px; border: 1px solid white; cursor: pointer; border-radius: 5px; }

        /* Taskbar */
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; gap: 25px; }
        .task-icon { width: 35px; height: 35px; cursor: pointer; transition: 0.2s; }
        .task-icon:hover { transform: scale(1.2); }

        #shutdown-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; z-index: 4000; justify-content: center; align-items: center; font-size: 35px; color: white; }
    </style>
</head>
<body>

    <div id="boot-screen">Starting windows minh nexus...</div>

    <div id="desktop">
        <div class="desktop-item" onclick="openWin('Recycle Bin', 'no times', 'https://icons8.com')">
            <img src="https://icons8.com"> Recycle Bin
        </div>

        <div id="win" class="window">
            <div class="title-bar" id="winHeader">
                <span id="win-title">Cửa sổ</span>
                <div class="controls">
                    <span style="cursor:default;">-</span> <span style="cursor:default;">🟦</span> <span style="color:red; cursor:pointer; font-weight:bold;" onclick="closeWin()">X</span>
                </div>
            </div>
            <div class="content" id="win-content"></div>
        </div>
    </div>

    <div id="start-menu">
        <h1 style="margin-bottom: 40px; color: #ffcc00;">START MENU</h1>
        <div class="start-apps">
            <div class="app-item" onclick="openWin('Edge', '://bing.com đã từ chối kết nối.')">
                <img src="https://icons8.com"><br>Edge
            </div>
            <div class="app-item" onclick="openWin('GitHub', '://github.com đã từ chối kết nối.')">
                <img src="https://icons8.com"><br>GitHub
            </div>
            <div class="app-item" onclick="openWin('Store', 'chưa có gì ở đây cả😉')">
                <img src="https://icons8.com"><br>Store
            </div>
            <div class="app-item" onclick="openWin('Explorer', 'no files')">
                <img src="https://icons8.com"><br>Explorer
            </div>
        </div>
        <div class="power-btns">
            <div class="power-btn" onclick="shutDown()">Shutdown</div>
            <div class="power-btn" onclick="alert('error')">Restart</div>
            <div class="power-btn" onclick="alert('error')">Sleep</div>
        </div>
        <p onclick="toggleStart()" style="cursor:pointer; margin-top:40px; color:#ff66cc;">[ Quay lại Desktop ]</p>
    </div>

    <div id="taskbar">
        <img src="https://icons8.com" class="task-icon" onclick="toggleStart()">
        <img src="https://icons8.com" class="task-icon" onclick="openWin('Edge', '://bing.com đã từ chối kết nối.')">
        <img src="https://icons8.com" class="task-icon" onclick="openWin('Explorer', 'no files')">
        <img src="https://icons8.com" class="task-icon" onclick="openWin('Store', 'chưa có gì ở đây cả😉')">
    </div>

    <div id="shutdown-screen">Shutting down...</div>

    <script>
        setTimeout(() => {
            document.getElementById('boot-screen').style.display = 'none';
            document.getElementById('desktop').style.display = 'block';
            document.getElementById('taskbar').style.display = 'flex';
        }, 3000);

        function toggleStart() {
            let m = document.getElementById('start-menu');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function openWin(t, c) {
            document.getElementById('win').style.display = 'flex';
            document.getElementById('win-title').innerText = t;
            document.getElementById('win-content').innerText = c;
            document.getElementById('start-menu').style.display = 'none';
        }

        function closeWin() { document.getElementById('win').style.display = 'none'; }

        function shutDown() {
            document.getElementById('shutdown-screen').style.display = 'flex';
            setTimeout(() => { location.reload(); }, 3000);
        }

        dragElement(document.getElementById("win"));
        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            document.getElementById("winHeader").onmousedown = dragMouseDown;
            function dragMouseDown(e) { e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY; document.onmouseup = closeDragElement; document.onmousemove = elementDrag; }
            function elementDrag(e) { e.preventDefault(); pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY; pos3 = e.clientX; pos4 = e.clientY; elmnt.style.top = (elmnt.offsetTop - pos2) + "px"; elmnt.style.left = (elmnt.offsetLeft - pos1) + "px"; }
            function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }
        }
    </script>
</body>
</html>
