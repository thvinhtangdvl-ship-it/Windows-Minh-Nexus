<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="cache-control" content="no-cache" />
    <title>Windows Minh-Nexus Pro - minh234</title>
    <style>
        body { margin: 0; background: linear-gradient(135deg, #ffcc00, #ff66cc); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        #boot { position: fixed; inset: 0; background: black; z-index: 9999; display: flex; justify-content: center; align-items: center; color: white; font-size: 25px; flex-direction: column; }
        #desktop { height: calc(100vh - 50px); padding: 20px; display: none; position: relative; }
        .item { width: 90px; text-align: center; color: white; font-weight: bold; cursor: pointer; text-shadow: 2px 2px black; font-size: 12px; }
        .icon-svg { width: 45px; height: 45px; display: block; margin: 0 auto 5px; }

        /* Cửa sổ co giãn mượt mà */
        .window { position: absolute; top: 80px; left: 80px; width: 450px; height: 300px; background: white; border-radius: 12px; display: none; flex-direction: column; color: black; box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 100; border: 1px solid #ccc; transition: 0.2s; }
        .bar { background: #f3f3f3; padding: 10px 15px; display: flex; justify-content: space-between; cursor: move; border-radius: 12px 12px 0 0; }
        .btns span { cursor: pointer; padding: 0 12px; font-weight: bold; font-size: 18px; }

        /* Start Menu chuẩn 11 có tên minh234 */
        #start { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; z-index: 1000; flex-direction: column; align-items: center; padding-top: 50px; color: white; backdrop-filter: blur(15px); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center; margin-bottom: 40px; }
        .app { border: 1px solid rgba(255,255,255,0.2); padding: 15px; width: 110px; background: rgba(255,255,255,0.1); cursor: pointer; border-radius: 8px; }
        .user-area { border-top: 1px solid #444; width: 350px; padding-top: 20px; display: flex; justify-content: space-between; align-items: center; }

        /* Taskbar có Tìm kiếm gõ được chữ */
        #taskbar { position: fixed; bottom: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.8); display: none; align-items: center; padding: 0 15px; box-sizing: border-box; }
        .search-box { background: white; border-radius: 20px; padding: 5px 15px; width: 220px; display: flex; align-items: center; border: 1px solid #ccc; }
        .search-box input { border: none; outline: none; background: transparent; width: 100%; font-size: 14px; }
        .task-center { flex: 1; display: flex; justify-content: center; gap: 20px; }
        .t-icon { width: 30px; height: 30px; cursor: pointer; }

        #sh-screen { position: fixed; inset: 0; background: black; display: none; z-index: 10000; justify-content: center; align-items: center; font-size: 30px; color: white; }
    </style>
</head>
<body>

<div id="boot">🪟 Starting Windows Minh Nexus...</div>

<div id="desktop">
    <div class="item" onclick="openW('Recycle Bin', 'no times')">
        <svg class="icon-svg" viewBox="0 0 48 48" fill="none" xmlns="http://w3.org"><path d="M9 10V44H39V10H9Z" fill="#2F88FF" stroke="#333" stroke-width="2"/><path d="M15 10L18 4H30L33 10" stroke="#333" stroke-width="2"/><path d="M4 10H44" stroke="#333" stroke-width="2"/></svg>
        Recycle Bin
    </div>

    <div id="win" class="window">
        <div class="bar" id="winH">
            <span id="wt">Cửa sổ</span>
            <div class="btns">
                <span onclick="minW()">-</span><span onclick="maxW()">🟦</span><span style="color:red;" onclick="closeW()">X</span>
            </div>
        </div>
        <div id="wc" style="padding:20px; font-size:18px; color: #333;"></div>
    </div>
</div>

<div id="start">
    <h2 style="margin-bottom: 40px; color: #ffcc00;">START MENU</h2>
    <div class="grid">
        <div class="app" onclick="openW('Edge', '://bing.com đã từ chối kết nối.')">🌐<br>Edge</div>
        <div class="app" onclick="openW('GitHub', 'www.github.com đã từ chối kết nối.')">📂<br>GitHub</div>
        <div class="app" onclick="openW('Store', 'chưa có gì ở đây cả😉')">🛒<br>Store</div>
        <div class="app" onclick="openW('Explorer', 'no files')">📁<br>Explorer</div>
    </div>
    <div class="user-area">
        <div>👩‍💻 minh234</div>
        <div style="display:flex; gap:10px;">
            <button onclick="sd()" style="padding:5px 10px; cursor:pointer;">Shutdown</button>
            <button onclick="alert('error')" style="padding:5px 10px; cursor:pointer;">Restart</button>
            <button onclick="alert('error')" style="padding:5px 10px; cursor:pointer;">Sleep</button>
        </div>
    </div>
    <p onclick="tk()" style="margin-top:30px; cursor:pointer; color:#00ff00;">[ Back to Desktop ]</p>
</div>

<div id="taskbar">
    <div class="search-box">
        🔍 <input type="text" id="searchInp" placeholder="Search Minh Nexus..." onkeyup="if(event.key==='Enter') alert('Sếp Minh vừa tìm: ' + this.value)">
    </div>
    <div class="task-center">
        <!-- Logo Win 11 chuẩn vẽ bằng mã -->
        <svg class="t-icon" onclick="tk()" viewBox="0 0 24 24" fill="#00A4EF"><path d="M0 0h11.5v11.5H0zM12.5 0H24v11.5H12.5zM0 12.5h11.5V24H0zM12.5 12.5H24V24H12.5z"/></svg>
        <span style="font-size:30px; cursor:pointer;" onclick="openW('Edge', '://bing.com đã từ chối kết nối.')">🌐</span>
        <span style="font-size:30px; cursor:pointer;" onclick="openW('Explorer', 'no files')">📁</span>
        <span style="font-size:30px; cursor:pointer;" onclick="openW('Store', 'chưa có gì ở đây cả😉')">🛒</span>
    </div>
</div>

<div id="sh-screen">Shutting down...</div>

<script>
    setTimeout(() => { document.getElementById('boot').style.display='none'; document.getElementById('desktop').style.display='block'; document.getElementById('taskbar').style.display='flex'; }, 3000);
    function tk() { let m = document.getElementById('start'); m.style.display = (m.style.display === 'flex') ? 'none' : 'flex'; }
    function openW(t, c) { let w = document.getElementById('win'); w.style.display='flex'; document.getElementById('wt').innerText = t; document.getElementById('wc').innerText = c; document.getElementById('start').style.display='none'; }
    function closeW() { document.getElementById('win').style.display='none'; }
    
    // Sửa nút 🟦: Bấm 1 lần phóng to, bấm lại thu nhỏ cực mượt
    function maxW() {
        let w = document.getElementById('win');
        if (w.style.width === '100%') { w.style.width = '450px'; w.style.height = '300px'; w.style.top = '80px'; w.style.left = '80px'; }
        else { w.style.width = '100%'; w.style.height = 'calc(100vh - 50px)'; w.style.top = '0'; w.style.left = '0'; }
    }

    function minW() { document.getElementById('win').style.display='none'; alert('Minh234: Đã thu nhỏ cửa sổ!'); }
    function sd() { document.getElementById('sh-screen').style.display='flex'; setTimeout(() => { location.reload(); }, 3000); }

    // Kéo thả thần thánh
    var win = document.getElementById("win"); var header = document.getElementById("winH");
    header.onmousedown = function(e) {
        var ox = e.clientX - win.offsetLeft; var oy = e.clientY - win.offsetTop;
        document.onmousemove = function(e) { win.style.left = (e.clientX - ox) + "px"; win.style.top = (e.clientY - oy) + "px"; };
        document.onmouseup = function() { document.onmousemove = null; };
    };
</script>
</body>
</html>
